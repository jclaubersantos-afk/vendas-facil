name: Build temporary Vendalume Gestão APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vendalume-gestao
    paths:
      - 'gestao-index.html'
      - 'gestao-android-wrapper.zip'
      - 'gestao-preview-readme.md'
      - '.github/workflows/build-gestao-preview.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the single Vendalume Gestão source
        uses: actions/checkout@v4

      - name: Set up Node for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the embedded JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('gestao-index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No embedded JavaScript found');
          scripts.forEach((match, index) => new Function(match[1]));
          console.log(`Validated ${scripts.length} script block(s)`);
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare the Android wrapper from the same app source
        run: |
          unzip -q gestao-android-wrapper.zip -d android
          mkdir -p android/app/src/main/assets
          cp gestao-index.html android/app/src/main/assets/index.html

      - name: Build temporary validation APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Share short-lived validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendalume-gestao-validation-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
