name: Build isolated Vendalume approved-improvements APK

on:
  push:
    branches:
      - restart/vendalume-approved-improvements
    paths:
      - 'index.html'
      - 'vendalume-approved-improvements-wrapper.zip'
      - 'test-approved-workflows.cjs'
      - 'test-route-approved.cjs'
      - '.github/workflows/build-approved-improvements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated approved-improvements branch
        uses: actions/checkout@v4
        with:
          ref: restart/vendalume-approved-improvements

      - name: Validate embedded JavaScript and navigation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (scripts.length !== 3) throw new Error(`Expected original three scripts; got ${scripts.length}`);
          scripts.forEach(m => { if (m[1].trim()) new Function(m[1]); });
          for (const token of ['gestao_claim_pairing_code','gestao_sync_sale','__gestaoSyncOutbox','__gestaoSyncAcknowledgements']) {
            if (!html.includes(token)) throw new Error(`Missing Gestión integration marker: ${token}`);
          }
          console.log(`Validated ${scripts.length} script blocks and Gestión integration`);
          NODE

      - name: Run route, navigation, and PDF checks
        run: node test-approved-workflows.cjs

      - name: Run route planner tests
        run: node test-route-approved.cjs

      - name: Prepare isolated wrapper
        run: |
          mkdir android
          unzip -q vendalume-approved-improvements-wrapper.zip -d android
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          grep -q "applicationId 'com.clauber.vendasfacil.approvedimprovements'" android/app/build.gradle
          grep -q 'https://appassets.androidplatform.net/assets/index.html' android/app/src/main/java/com/clauber/vendasfacil/approvedimprovements/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build isolated approved-improvements APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload temporary artifact only
        uses: actions/upload-artifact@v4
        with:
          name: vendalume-approved-improvements-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
